location = /apikey {
  return 308 /apikey/;
}

location ^~ /apikey/api/ {
  proxy_pass http://127.0.0.1:18080/api/;
  proxy_http_version 1.1;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_buffering off;
}

location ^~ /apikey/v1/ {
  proxy_pass http://127.0.0.1:18080/v1/;
  proxy_http_version 1.1;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_buffering off;
}

location ^~ /apikey/v1beta/ {
  proxy_pass http://127.0.0.1:18080/v1beta/;
  proxy_http_version 1.1;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_buffering off;
}

location ^~ /apikey/backend-api/codex/ {
  proxy_pass http://127.0.0.1:18080/backend-api/codex/;
  proxy_http_version 1.1;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_buffering off;
}

location ~ ^/apikey/setup/(status|test-db|test-redis|install)$ {
  rewrite ^/apikey(/.*)$ $1 break;
  proxy_pass http://127.0.0.1:18080;
  proxy_http_version 1.1;
}

location /apikey/ {
  root /opt/sub2api-apikey/www;
  try_files $uri $uri/ /apikey/index.html;
}
